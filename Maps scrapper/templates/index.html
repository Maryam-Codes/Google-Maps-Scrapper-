<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadHunter</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#09090f;--card:#16161f;--border:#2a2a3a;--accent:#00e5a0;--accent2:#6c5ce7;--warn:#f9ca24;--danger:#ff4757;--text:#e8e8f0;--muted:#6b6b80;--font-head:'Syne',sans-serif;--font-mono:'Space Mono',monospace}
    body{background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:13px;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
    body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.25;pointer-events:none;z-index:0}
    .wrapper{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 32px 80px}
    header{padding:48px 0 40px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
    .logo-eyebrow{font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
    h1{font-family:var(--font-head);font-size:clamp(36px,5vw,64px);font-weight:800;line-height:1;letter-spacing:-.02em}
    h1 span{color:var(--accent)}
    .header-meta{font-size:11px;color:var(--muted);text-align:right}
    .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle;transition:background .3s}
    .status-dot.running{background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .control-panel{margin-top:40px;background:var(--card);border:1px solid var(--border);padding:32px;display:grid;grid-template-columns:1fr 1fr auto;gap:20px;align-items:end}
    .field-group{display:flex;flex-direction:column;gap:8px}
    label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    input[type=text]{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:13px;padding:12px 16px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
    input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,160,.12)}
    input[type=text]::placeholder{color:var(--muted)}
    .btn-run{background:var(--accent);color:#09090f;border:none;font-family:var(--font-head);font-weight:800;font-size:14px;letter-spacing:.05em;padding:12px 32px;cursor:pointer;transition:background .2s,transform .1s,box-shadow .2s;white-space:nowrap}
    .btn-run:hover:not(:disabled){background:#00ffb3;box-shadow:0 0 24px rgba(0,229,160,.4)}
    .btn-run:active:not(:disabled){transform:scale(.98)}
    .btn-run:disabled{background:var(--muted);cursor:not-allowed}
    .log-section{margin-top:32px;display:none}
    .log-section.visible{display:block}
    .log-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .log-header h2{font-family:var(--font-head);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .log-sep{flex:1;height:1px;background:var(--border)}
    .log-badge{font-size:10px;padding:3px 8px;background:var(--accent2);color:#fff;letter-spacing:.1em}
    .log-panel{background:#0a0a12;border:1px solid var(--border);border-left:3px solid var(--accent2);height:260px;overflow-y:auto;padding:16px;font-size:11px;line-height:1.9;color:var(--muted)}
    .log-line{display:block}
    .log-line.phase{color:var(--accent)}
    .log-line.done{color:var(--warn);font-weight:700}
    .log-line.error{color:var(--danger)}
    .download-section{margin-top:24px;display:none;gap:12px;align-items:center}
    .download-section.visible{display:flex}
    .dl-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
    .btn-dl{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:8px 18px;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}
    .btn-dl:hover{border-color:var(--accent);color:var(--accent)}
    .btn-dl svg{width:13px;height:13px}
    .toast{position:fixed;bottom:32px;right:32px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);padding:14px 20px;font-size:12px;z-index:999;transform:translateY(100px);opacity:0;transition:transform .3s,opacity .3s;max-width:360px}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.error{border-left-color:var(--danger)}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border)}
    @media(max-width:700px){.control-panel{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}.header-meta{text-align:left}}
  </style>
</head>
<body>
<div class="wrapper">
  <header>
    <div>
      <div class="logo-eyebrow">// lead generation engine v2.0</div>
      <h1>Lead<span>Hunter</span></h1>
    </div>
    <div class="header-meta">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">IDLE</span><br>
      <span style="margin-top:6px;display:block">Google Maps → Social → Filter → Sheets</span>
    </div>
  </header>

  <div class="control-panel">
    <div class="field-group">
      <label>Business Type(s)</label>
      <input type="text" id="businessType" placeholder="e.g. clinics, gyms, restaurants" />
    </div>
    <div class="field-group">
      <label>Location / City</label>
      <input type="text" id="location" placeholder="e.g. Lahore, Sydney NSW" />
    </div>
    <button class="btn-run" id="runBtn" onclick="startScraper()">▶ RUN</button>
  </div>

  <div class="log-section" id="logSection">
    <div class="log-header">
      <h2>Live Log</h2>
      <div class="log-sep"></div>
      <div class="log-badge">STREAMING</div>
    </div>
    <div class="log-panel" id="logPanel"></div>
  </div>

  <div class="download-section" id="downloadSection">
    <span class="dl-label">Download results:</span>
    <a class="btn-dl" href="/download/csv" target="_blank">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15V3m0 12-4-4m4 4 4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/></svg>CSV
    </a>
    <a class="btn-dl" href="/download/xlsx" target="_blank">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15V3m0 12-4-4m4 4 4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/></svg>XLSX
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let eventSource = null;

  function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast'+(isError?' error':'')+' show';
    setTimeout(()=>t.className='toast'+(isError?' error':''), 3500);
  }

  function setStatus(running) {
    document.getElementById('statusDot').className = 'status-dot'+(running?' running':'');
    document.getElementById('statusText').textContent = running?'RUNNING':'IDLE';
    const btn = document.getElementById('runBtn');
    btn.disabled = running;
    btn.textContent = running?'⏳ RUNNING...':'▶ RUN';
  }

  function appendLog(line) {
    const panel = document.getElementById('logPanel');
    const el = document.createElement('span');
    el.className = 'log-line';
    if (line.startsWith('[PHASE')||line.startsWith('[Phase')) el.classList.add('phase');
    else if (line.startsWith('[DONE]')) el.classList.add('done');
    else if (line.startsWith('[ERROR]')) el.classList.add('error');
    el.textContent = line;
    panel.appendChild(el);
    panel.scrollTop = panel.scrollHeight;

    if (line.startsWith('[DONE]')) {
      setStatus(false); stopStream();
      document.getElementById('downloadSection').classList.add('visible');
      showToast('✓ Pipeline complete — results uploaded to Google Sheets.');
    }
    if (line.startsWith('[ERROR]')) {
      setStatus(false); stopStream();
      showToast(line, true);
    }
  }

  function startStream() {
    if (eventSource) eventSource.close();
    eventSource = new EventSource('/stream');
    eventSource.onmessage = e => { if (e.data!=='[PING]') appendLog(e.data); };
    eventSource.onerror = () => { stopStream(); setStatus(false); };
  }

  function stopStream() {
    if (eventSource) { eventSource.close(); eventSource=null; }
  }

  async function startScraper() {
    const bt  = document.getElementById('businessType').value.trim();
    const loc = document.getElementById('location').value.trim();
    if (!bt||!loc) { showToast('Please fill in both fields.',true); return; }

    document.getElementById('logPanel').innerHTML = '';
    document.getElementById('logSection').classList.add('visible');
    document.getElementById('downloadSection').classList.remove('visible');
    setStatus(true);

    try {
      const res  = await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_type:bt,location:loc})});
      const data = await res.json();
      if (data.status!=='ok') { showToast(data.message||'Failed to start.',true); setStatus(false); return; }
      startStream();
    } catch(e) { showToast('Network error: '+e.message,true); setStatus(false); }
  }

  document.addEventListener('keydown', e => {
    if (e.key==='Enter') {
      const a = document.activeElement;
      if (a&&(a.id==='businessType'||a.id==='location')) startScraper();
    }
  });
</script>
</body>
</html>
